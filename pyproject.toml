[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nisar-gcov-backend"
version = "0.1.0"
description = "NISAR GCOV ingestion, full-resolution COGs, legends and XYZ map tiles"
requires-python = ">=3.11"
dependencies = [
  "h5py>=3.11,<4", "numpy>=2,<3", "rasterio>=1.4,<2",
  "pyproj>=3.6,<4", "fastapi>=0.115,<1", "uvicorn>=0.30,<1",
  "pillow>=11,<14", "matplotlib>=3.9,<4", "shapely>=2,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
gcov = "nisar_backend.cli:main"

[tool.setuptools.packages.find]
include = ["nisar_backend*"]

[tool.setuptools.package-data]
nisar_backend = ["static/*", "static/vendor/*"]

[tool.setuptools.data-files]
"share/terraphase/explorer" = ["dist/index.html", "dist/app.js", "dist/styles.css", "dist/nisar-integration.js", "dist/nisar-integration.css"]
"share/terraphase/explorer/data" = ["dist/data/*.json", "dist/data/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]

